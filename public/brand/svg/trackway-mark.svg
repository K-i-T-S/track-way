<svg width="256" height="192" viewBox="0 0 256 192" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">TrackWay Fleet Blade Mark</title>
<desc id="desc">A sharp forward-motion fleet blade logo mark in black and rgb(0 229 212).</desc>
<defs>
